---
- name: Check if Vault transit engine exists
  uri:
    url: "{{ vault_url }}/v1/sys/mounts"
    method: GET
    headers:
      "X-Vault-Token": "{{ vault_vars.vault_token }}"
    validate_certs: false
  register: vault_mounts

- name: Enable transit secrets engine if not present
  uri:
    url: "{{ vault_url }}/v1/sys/mounts/transit"
    method: POST
    headers:
      "X-Vault-Token": "{{ vault_vars.vault_token }}"
    body_format: json
    body:
      type: "transit"
    validate_certs: false
  when: "'transit/' not in vault_mounts.json"
  register: transit_created

- name: Check if Vault transit key exists
  uri:
    url: "{{ vault_url }}/v1/transit/keys/{{ vault_key }}"
    method: GET
    headers:
      "X-Vault-Token": "{{ vault_vars.vault_token }}"
    validate_certs: false
  register: transit_key_check
  failed_when: false

- name: Create Vault transit key if not exists
  uri:
    url: "{{ vault_url }}/v1/transit/keys/{{ vault_key }}"
    method: POST
    headers:
      "X-Vault-Token": "{{ vault_vars.vault_token }}"
    body_format: json
    body:
      type: "aes256-gcm96"
    validate_certs: false
  when: transit_key_check.status == 404

- name: Split vault_secret_path into mount and subpath
  set_fact:
    vault_mount: "{{ vault_secret_path.split('/')[0] }}"
    vault_subpath: "{{ vault_secret_path.split('/')[1:] | join('/') }}"
  when: vault_secret_path is defined

- name: Get current mounts from Vault
  uri:
    url: "{{ vault_url }}/v1/sys/mounts"
    method: GET
    headers:
      "X-Vault-Token": "{{ vault_vars.vault_token }}"
    validate_certs: false
  register: vault_mounts_for_kv

- name: Enable kv v2 at mount if not present
  uri:
    url: "{{ vault_url }}/v1/sys/mounts/{{ vault_mount }}"
    method: POST
    headers:
      "X-Vault-Token": "{{ vault_vars.vault_token }}"
    body_format: json
    body:
      type: "kv"
      options:
        version: "2"
    validate_certs: false
  when: "vault_mount ~ '/' not in vault_mounts_for_kv.json"
  register: enable_kv_mount

- name: Check whether KV v2 secret path exists
  uri:
    url: "{{ vault_url }}/v1/{{ vault_mount }}/data/{{ vault_subpath }}"
    method: GET
    headers:
      "X-Vault-Token": "{{ vault_vars.vault_token }}"
    status_code: [200,404]
    validate_certs: false
  register: kv_path_check
  when: vault_subpath != ""

- name: Create KV v2 secret path if not exists
  uri:
    url: "{{ vault_url }}/v1/{{ vault_mount }}/data/{{ vault_subpath }}"
    method: POST
    headers:
      "X-Vault-Token": "{{ vault_vars.vault_token }}"
    body_format: json
    body:
      data: {}
    validate_certs: false
  when:
    - kv_path_check is defined
    - kv_path_check.status == 404

- name: Check if service account already exists for user {{ user.user }}
  vars:
    USERNAME: "{{ user.user }}"
  shell: |
    mc admin user svcacct ls "{{ mc_alias }}" "{{ USERNAME }}" 2>&1
  register: existing_svcacct
  changed_when: false
  failed_when: false

- name: Parse service account status
  set_fact:
    has_svcacct: "{{ 'accessKey' in existing_svcacct.stdout or existing_svcacct.stdout | regex_search('[A-Z0-9]{20}') }}"

- name: Create service account for user {{ user.user }}
  vars:
    USERNAME: "{{ user.user }}"
    SVCACCT_JSON_FILE: "/tmp/{{ USERNAME }}_svcacct.json"
  shell: |
    mc admin user svcacct add "{{ mc_alias }}" "{{ USERNAME }}" > "{{ SVCACCT_JSON_FILE }}"
    ACCESS_KEY=$(grep 'Access Key:' "{{ SVCACCT_JSON_FILE }}" | cut -d':' -f2- | xargs)
    SECRET_KEY=$(grep 'Secret Key:' "{{ SVCACCT_JSON_FILE }}" | cut -d':' -f2- | xargs)
    echo "ACCESS_KEY=$ACCESS_KEY"
    echo "SECRET_KEY=$SECRET_KEY"
  register: svcacct_result
  changed_when: true
  when: not has_svcacct

- name: Extract service account keys for {{ user.user }}
  set_fact:
    access_key: "{{ svcacct_result.stdout | regex_search('ACCESS_KEY=(.+)', '\\1') | first }}"
    secret_key: "{{ svcacct_result.stdout | regex_search('SECRET_KEY=(.+)', '\\1') | first }}"
  when: 
    - not has_svcacct
    - svcacct_result is defined
    - svcacct_result.stdout is defined

- name: Save access and secret keys to local file
  copy:
    dest: "{{ vault_local_keys_dir }}/{{ user.user }}_keys.txt"
    content: |
      User: {{ user.user }}
      AccessKey: {{ access_key }}
      SecretKey: {{ secret_key }}
  when: 
    - not has_svcacct
    - access_key is defined 
    - secret_key is defined

- name: Encrypt keys with Vault transit engine
  uri:
    url: "{{ vault_url }}/v1/transit/encrypt/{{ vault_key }}"
    method: POST
    headers:
      "X-Vault-Token": "{{ vault_vars.vault_token }}"
    body_format: json
    body:
      plaintext: "{{ ('AccessKey=' ~ access_key ~ ';SecretKey=' ~ secret_key) | b64encode }}"
    validate_certs: false
  register: vault_encrypt
  when: 
    - not has_svcacct
    - access_key is defined 
    - secret_key is defined

- name: Save access and secret keys 
  community.hashi_vault.vault_kv2_write:
    url: "{{ vault_url }}"
    token: "{{ vault_vars.vault_token }}"
    path: "{{ vault_secret_path }}/{{ user.user }}"
    data:
      access_key: "{{ access_key }}"
      secret_key: "{{ secret_key }}"
    validate_certs: false
  when: 
    - not has_svcacct
    - access_key is defined 
    - secret_key is defined

- name: Service account already exists for {{ user.user }}
  debug:
    msg: "Service account for user {{ user.user }} already exists. Skipping creation."
  when: has_svcacct